      <div>© ${new Date().getFullYear()} Nivaldo Piccinin Imóveis • CRECI 111.085 • Todos os direitos reservados</div>
      <div style="margin-top:4px">${config.endereco} • Tel ${config.tel}</div>
    </div>
  </div>

  <div id="detail"></div>
  <div id="pageOverlay" class="page-overlay" onclick="closePage()"><div class="page-modal" onclick="event.stopPropagation()"><div class="page-modal-h"><h3 id="pageTitle" style="margin:0;color:#146e31"></h3><button class="btn" onclick="closePage()">✕</button></div><div id="pageBody" class="page-modal-b"></div></div></div>
  `;
}

function openPage(key){
  const overlay=document.getElementById('pageOverlay');
  const title=document.getElementById('pageTitle');
  const body=document.getElementById('pageBody');
  const map={quem:'Quem Somos', missao:'Nossa Missão', priv:'Privacidade e Proteção de Dados'};
  title.textContent=map[key]||'';
  body.textContent=textos[key]||'';
  overlay.classList.add('open');
}
function closePage(){ document.getElementById('pageOverlay').classList.remove('open'); }
function goCar(i){ carouselIndex=i; renderSite(); }
function setFilter(k,v){ filters[k]=v; renderSite(); window.scrollTo(0,0); }

function openDetail(id){
  const p=properties.find(x=>x.id===id); if(!p) return;
  const similares = properties.filter(x=>x.id!==p.id && (x.bairro===p.bairro || x.tipo===p.tipo)).slice(0,3);
  const d=document.getElementById('detail');
  d.innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:grid;place-items:center;padding:12px;overflow:auto" onclick="if(event.target===this) this.remove()">
  <div style="background:#fff;border-radius:20px;max-width:960px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.4)">
    <div style="position:relative">
      <img src="${p.fotos[0]}" style="width:100%;height:380px;object-fit:cover;border-radius:20px 20px 0 0" id="detailMainImg">
      <button onclick="this.closest('div').parentElement.parentElement.remove()" style="position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer">✕</button>
      <div style="position:absolute;bottom:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap">${(p.fotos||[]).slice(0,6).map((u,i)=>`<img src="${u}" onclick="document.getElementById('detailMainImg').src='${u}'" style="width:56px;height:42px;object-fit:cover;border-radius:8px;border:2px solid ${i===0?'#1a8a3d':'rgba(255,255,255,.7)'};cursor:pointer">`).join('')}</div>
      <div style="position:absolute;top:12px;left:12px;display:flex;gap:6px"><span style="background:#1a8a3d;color:#fff;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700">${p.finalidade}</span><span style="background:rgba(255,255,255,.92);color:#146e31;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700">${p.codigo} • ${p.bairro}</span></div>
    </div>
    <div style="padding:20px 22px;display:grid;grid-template-columns:1.2fr .8fr;gap:20px">
      <div>
        <h2 style="margin:0 0 6px;font-size:22px;line-height:1.2">${p.titulo}</h2>
        <div style="font-size:12px;color:#5a6b52;margin-bottom:10px">${p.tipo} • ${p.dorm||0} dorm • ${p.suites||0} suítes • ${p.banheiros||0} banh • ${p.vagas||0} vagas • ${p.areaConstruida} m² const • ${p.areaTerreno||p.areaConstruida} m² terreno • ${p.cidade}/${p.uf}</div>
        <div style="font-size:24px;font-weight:800;color:#146e31;margin:10px 0">${fmtBRL(p.valor)} ${p.condominioValor? `<span style="font-size:13px;color:#666;font-weight:400">• Cond ${fmtBRL(p.condominioValor)}</span>`:''} ${p.iptu? `<span style="font-size:13px;color:#666;font-weight:400">• IPTU ${fmtBRL(p.iptu)}</span>`:''}</div>
        <div style="background:#f7faf4;border:1px solid #dfe8d5;border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0">
          <div style="text-align:center"><div style="font-size:11px;color:#6b7d63;text-transform:uppercase">Dorms</div><div style="font-weight:700">${p.dorm||0}</div></div>
          <div style="text-align:center"><div style="font-size:11px;color:#6b7d63;text-transform:uppercase">Suítes</div><div style="font-weight:700">${p.suites||0}</div></div>
          <div style="text-align:center"><div style="font-size:11px;color:#6b7d63;text-transform:uppercase">Vagas</div><div style="font-weight:700">${p.vagas||0}</div></div>
          <div style="text-align:center"><div style="font-size:11px;color:#6b7d63;text-transform:uppercase">Área const</div><div style="font-weight:700">${p.areaConstruida} m²</div></div>
          <div style="text-align:center"><div style="font-size:11px;color:#6b7d63;text-transform:uppercase">Área terreno</div><div style="font-weight:700">${p.areaTerreno||p.areaConstruida} m²</div></div>
          <div style="text-align:center"><div style="font-size:11px;color:#6b7d63;text-transform:uppercase">Bairro</div><div style="font-weight:700;font-size:12px">${p.bairro}</div></div>
        </div>
        <h4 style="margin:16px 0 8px;color:#146e31">Descrição completa</h4>
        <div style="white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:#333;background:#fff;border:1px solid #eef5e9;border-radius:12px;padding:14px">${p.descricao||'Imóvel em excelente localização, com ótimo acabamento, documentação em dia. Agende sua visita com '+config.nome+' - CRECI '+config.creci+'.'}</div>
        
        <h4 style="margin:20px 0 10px;color:#146e31">Imóveis semelhantes</h4>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          ${similares.map(s=>`
            <div style="border:1px solid #dfe8d5;border-radius:12px;overflow:hidden;cursor:pointer;background:#fff" onclick="openDetail('${s.id}')">
              <img src="${s.fotos[0]}" style="width:100%;height:90px;object-fit:cover">
              <div style="padding:8px"><div style="font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.titulo}</div><div style="font-size:10px;color:#6b7d63">${s.bairro} • ${s.dorm} dorm</div><div style="font-size:12px;font-weight:800;color:#146e31;margin-top:4px">${fmtBRL(s.valor)}</div></div>
            </div>
          `).join('')}
          ${similares.length===0?'<div style="grid-column:1/-1;font-size:12px;color:#888">Nenhum similar encontrado no mesmo bairro/tipo</div>':''}
        </div>
      </div>
      <div>
        <div style="background:#f9fbf8;border:1px solid #dfe8d5;border-radius:16px;padding:16px;position:sticky;top:12px">
          <h4 style="margin:0 0 4px;color:#146e31">Interesse neste imóvel?</h4>
          <div style="font-size:11px;color:#6b7d63;margin-bottom:12px">Fale direto com ${config.nome} • ${config.creciFull}<br>${config.tel}</div>
          
          <label style="font-size:11px;font-weight:600;display:block;margin-bottom:4px">Seu nome*</label>
          <input id="leadNome" placeholder="Ex: João Silva" style="width:100%;padding:10px 12px;border:1px solid #dfe8d5;border-radius:10px;margin-bottom:10px;font-size:12px">
          
          <label style="font-size:11px;font-weight:600;display:block;margin-bottom:4px">Seu WhatsApp*</label>
          <input id="leadTel" placeholder="(19) 9xxxx-xxxx" style="width:100%;padding:10px 12px;border:1px solid #dfe8d5;border-radius:10px;margin-bottom:10px;font-size:12px">
          
          <label style="font-size:11px;font-weight:600;display:block;margin-bottom:4px">Mensagem / Pergunta</label>
          <textarea id="leadMsg" placeholder="Olá, tenho interesse no ${p.codigo} - ${p.titulo}. Gostaria de agendar visita / mais informações..." style="width:100%;padding:10px 12px;border:1px solid #dfe8d5;border-radius:10px;min-height:90px;font-size:12px;resize:vertical"></textarea>
          
          <button onclick="enviarWhats('${p.codigo}','${p.titulo.replace(/'/g,"")}')" style="width:100%;background:#1a8a3d;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:13px;cursor:pointer;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px">💬 Enviar interesse via WhatsApp</button>
          
          <div style="text-align:center;margin-top:10px"><a href="https://wa.me/${config.telRaw}?text=Olá ${config.nome}! Tenho interesse no imóvel ${p.codigo} - ${p.titulo} - ${fmtBRL(p.valor)}" target="_blank" style="font-size:11px;color:#1a8a3d;text-decoration:underline">Ou clique aqui para falar direto</a></div>
          
          <div style="margin-top:14px;background:#eaf5ec;border-radius:10px;padding:10px;font-size:11px;color:#2e7d32">
            <b>Atendimento direto:</b><br>
            ${config.nome}<br>
            ${config.creciFull}<br>
            ${config.endereco}<br>
            Tel: ${config.tel}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>`;
}

function enviarWhats(codigo, titulo){
  const nome=document.getElementById('leadNome')?.value||'';
  const tel=document.getElementById('leadTel')?.value||'';
  const msg=document.getElementById('leadMsg')?.value||'';
  if(!nome){ alert('Por favor, informe seu nome'); return; }
  if(!tel){ alert('Por favor, informe seu WhatsApp'); return; }
  const texto=`Olá ${config.nome}! Meu nome é ${nome} (WhatsApp: ${tel}). Tenho interesse no imóvel ${codigo} - ${titulo}. ${msg} Vim pelo site.`;
  const url=`https://wa.me/${config.telRaw}?text=${encodeURIComponent(texto)}`;
  window.open(url,'_blank');
}


setInterval(()=>{
  const destaques = properties.filter(p=>p.destaque);
  if(destaques.length===0) return;
  carouselIndex = (carouselIndex+1) % destaques.length;
  const car = destaques[carouselIndex];
  const img = document.getElementById('carImg');
  if(img && car){
    img.style.opacity='0.5';
    setTimeout(()=>{ img.src=car.fotos[0]; img.style.opacity='1'; }, 200);
  }
  const dots = document.querySelectorAll('.carousel-dots span');
  dots.forEach((d,i)=>{ d.classList.toggle('active', i===carouselIndex); });
  const info = document.querySelector('.carousel-info');
  if(info && car){
    const badge = info.querySelector('.badge');
    if(badge) badge.textContent = car.finalidade + ' • ' + car.codigo + ' • ' + car.bairro;
    const h3 = info.querySelector('h3');
    if(h3) h3.textContent = car.titulo;
    const price = info.querySelector('.price');
    if(price) price.textContent = fmtBRL(car.valor);
    const desc = info.querySelector('.desc');
    if(desc) desc.textContent = car.descricao||'';
    const btn = info.querySelector('button');
    if(btn) btn.setAttribute('onclick', `openDetail('${car.id}')`);
  }
}, 4000);
renderSite();
</script>
</body>
</html>
