
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>CRM - Gestão Imóveis Completa - Nivaldo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--line:#dfe8d5;--primary:#1a8a3d;--primary-dark:#12632c;--primary-light:#eaf5ec;--paper:#f1f6ec}
*{box-sizing:border-box}body{margin:0;font-family:'Inter',system-ui,Arial;background:var(--paper);color:#121212}
.crm-app{display:flex;min-height:100vh}
.sidebar{width:250px;background:linear-gradient(180deg,#143d1f 0%, #0a2210 100%);color:#c8e6c9;padding:16px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar a{color:#c8e6c9;text-decoration:none;padding:10px 12px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:10px;font-weight:500}
.sidebar a.active,.sidebar a:hover{background:rgba(255,255,255,.12);color:#fff}
.sec{font-size:10px;letter-spacing:.12em;opacity:.6;margin:16px 0 6px;text-transform:uppercase;color:#a5d6a7}
.main{flex:1;display:flex;flex-direction:column;overflow:auto}
.crm-top{padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.content{padding:20px;flex:1;overflow:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#f9fbf8;flex-wrap:wrap;gap:10px}
.card-body{padding:14px}
.badge2{background:var(--primary-light);border:1px solid #c8e6c9;color:var(--primary-dark);padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12px;cursor:pointer;font-weight:600}
.btn-dark{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(26,138,61,.2)}
.btn-sm{padding:6px 10px;font-size:11px}
.greeting{background:linear-gradient(135deg,#1a8a3d 0%, #0a2210 100%);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(26,138,61,.25)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}.kpi small{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.5px}.kpi strong{font-size:22px;font-weight:800;line-height:1}.kpi span{font-size:11px;color:#888}
.dashboard-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:18px}
@media(max-width:1000px){.dashboard-grid{grid-template-columns:1fr}}
.finance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.finance-grid{grid-template-columns:1fr}}
.finance-card{border-radius:14px;padding:14px;border:1px solid var(--line)}
.finance-card.receita{background:linear-gradient(135deg,#e8f5e9 0%, #c8e6c9 100%);border-color:#a5d6a7}
.finance-card.despesa{background:linear-gradient(135deg,#ffebee 0%, #ffcdd2 100%);border-color:#ef9a9a}
.finance-card.saldo{background:linear-gradient(135deg,#1a8a3d 0%, #0a2210 100%);color:#fff;border-color:#0a2210}
.agenda-item{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;align-items:flex-start}.agenda-item div{overflow:hidden;word-break:break-word}
.agenda-time{width:64px;text-align:center;flex-shrink:0;display:flex;flex-direction:column;gap:2px}.agenda-time strong{font-size:13px;font-weight:700;display:block}.agenda-time small{font-size:10px;color:#666;display:block}
.lead-stage{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;margin:2px}
.stage-novo{background:#e3f2fd;color:#1565c0}.stage-atendimento{background:#fff3e0;color:#ef6c00}.stage-visita{background:#e8f5e9;color:#2e7d32}.stage-proposta{background:#f3e5f5;color:#7b1fa2}.stage-fechado{background:#e0f2f1;color:#00695c}
/* IMOVEIS GRID */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:#fff;min-width:140px}
.imoveis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1200px){.imoveis-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.imoveis-grid{grid-template-columns:1fr}}
.imovel-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);display:flex;flex-direction:column}
.imovel-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:#c8e6c9}
.imovel-img{position:relative;height:180px;background:#f1f6ec;overflow:hidden}
.imovel-img img{width:100%;height:100%;object-fit:cover}
.imovel-img .top-badges{position:absolute;top:8px;left:8px;display:flex;gap:6px}
.imovel-img .top-badges span{background:rgba(255,255,255,.95);border:1px solid var(--line);padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700}
.imovel-img .capa-badge{position:absolute;bottom:8px;left:8px;background:var(--primary);color:#fff;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700}
.imovel-info{padding:12px;flex:1;display:flex;flex-direction:column}
.imovel-info h4{margin:0 0 4px;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.imovel-meta{font-size:11px;color:#666;margin-bottom:6px}
.imovel-price{font-weight:800;color:var(--primary-dark);font-size:15px;margin-top:auto}
.imovel-actions{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:#f9fbf8}
.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#f9fbf8;flex-wrap:wrap;gap:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10px;text-transform:uppercase;color:#666;background:#f7faf4}
.modal-bg{position:fixed;inset:0;background:rgba(10,34,16,.6);backdrop-filter:blur(8px);display:none;place-items:center;z-index:100;padding:12px}
.modal-bg.open{display:grid}
.modal{background:#fff;border-radius:20px;max-width:900px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.modal-b{padding:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
.fgrid .full{grid-column:1/-1}
.fgrid label{font-size:11px;font-weight:600;display:flex;flex-direction:column;gap:5px;color:#333}
.fgrid input,.fgrid select,.fgrid textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:12px;background:#fff}
.fgrid textarea{min-height:80px;resize:vertical}
.bm{width:40px;height:40px;border-radius:10px;overflow:hidden;background:#fff;display:grid;place-items:center}
.bm img{width:100%;height:100%;object-fit:contain}
</style>
</head>

// Converte data URI para Blob
function dataURItoBlob(dataURI){
  const byteString = atob(dataURI.split(',')[1]);
  const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
  const ab = new ArrayBuffer(byteString.length);
  const ia = new Uint8Array(ab);
  for(let i=0;i<byteString.length;i++) ia[i]=byteString.charCodeAt(i);
  return new Blob([ab], {type: mimeString});
}

// Upload foto para Facebook e retorna ID e URL pública
async function uploadFotoParaFacebook(fotoDataURI, token, pageId, published=false){
  try{
    let resp;
    let photoId = null;
    if(fotoDataURI.startsWith('data:')){
      const blob = dataURItoBlob(fotoDataURI);
      const form = new FormData();
      form.append('source', blob, 'foto.jpg');
      form.append('published', published ? 'true' : 'false');
      form.append('access_token', token);
      resp = await fetch(`https://graph.facebook.com/v19.0/${pageId}/photos`, {method:'POST', body:form});
    } else {
      const body = new URLSearchParams();
      body.append('url', fotoDataURI);
      body.append('published', published ? 'true' : 'false');
      body.append('access_token', token);
      resp = await fetch(`https://graph.facebook.com/v19.0/${pageId}/photos`, {method:'POST', body:body});
    }
    const data = await resp.json();
    console.log('FB upload response:', data);
    if(data.error){
      console.error('FB upload error:', data.error);
      return null;
    }
    if(data.id){
      photoId = data.id;
      // Pega URL pública da foto com retry
      let publicUrl = null;
      for(let attempt=0; attempt<3; attempt++){
        try{
          if(attempt>0) await new Promise(r=>setTimeout(r, 1500));
          const urlInfo = `https://graph.facebook.com/v19.0/${data.id}?fields=images,link,picture&access_token=${token}`;
          console.log(`FB: Tentando pegar URL pública, tentativa ${attempt+1}:`, urlInfo.substring(0,100));
          const respInfo = await fetch(urlInfo);
          const info = await respInfo.json();
          console.log(`FB: Info tentativa ${attempt+1}:`, info);
          if(info.images && info.images[0] && info.images[0].source){
            publicUrl = info.images[0].source;
            console.log(`FB: URL pública obtida na tentativa ${attempt+1}:`, publicUrl.substring(0,100));
            break;
          } else if(info.link){
            // Fallback: usa link se images não disponível
            publicUrl = info.link;
            console.log(`FB: Usando link como fallback:`, publicUrl);
            break;
          } else if(info.picture){
            publicUrl = info.picture;
            console.log(`FB: Usando picture como fallback:`, publicUrl);
            break;
          }
        }catch(e){
          console.warn(`FB: Erro tentativa ${attempt+1} ao pegar URL:`, e);
        }
      }
      // Se ainda não tem URL, tenta construir URL direta do CDN via picture
      if(!publicUrl){
        try{
          // Tenta endpoint picture
          const picUrl = `https://graph.facebook.com/v19.0/${data.id}/picture?access_token=${token}&width=800`;
          console.log(`FB: Tentando picture endpoint:`, picUrl);
          publicUrl = picUrl; // Usa mesmo que seja redirect
        }catch(e){}
      }
      return {id: data.id, url: publicUrl, post_id: data.post_id, link: data.link};
    } else {
      console.error('Erro upload FB: sem ID', data);
      return null;
    }
  }catch(e){ console.error('Erro upload FB:', e); return null; }
}

      const resp = await fetch(`https://graph.facebook.com/v19.0/${pageId}/feed`, {method:'POST', body:body});

      if(up && up.id){
        try{

          body.append('message', mensagem);
          body.append('access_token', token);
          await fetch(`https://graph.facebook.com/v19.0/${up.id}`, {method:'POST', body:body});
        }catch(e){}
      }
      if(btn){ btn.textContent='📢 Publicar'; btn.disabled=false; }
      return !!up;
    } else {
      const uploaded = [];
      for(let i=0;i<fotos.length;i++){
        if(btn) btn.textContent=`📘 Face ${i+1}/${fotos.length}...`;
        const up = await uploadFotoParaFacebook(fotos[i], token, pageId, false);
        if(up) uploaded.push({media_fbid: up.id});

      if(uploaded.length===0){ if(btn){ btn.textContent='📢 Publicar'; btn.disabled=false; } return false; }

      body.append('message', mensagem);
      uploaded.forEach((item, idx)=>{ body.append(`attached_media[${idx}]`, JSON.stringify(item)); });
      body.append('access_token', token);
      const resp = await fetch(`https://graph.facebook.com/v19.0/${pageId}/feed`, {method:'POST', body:body});
      const data = await resp.json();
      if(btn){ btn.textContent='📢 Publicar'; btn.disabled=false; }
      return !!data.id;
    }
  }catch(e){
    console.error(e);
    if(btn){ btn.textContent='📢 Publicar'; btn.disabled=false; }

async function publicarImovelAtual(){
  const btn = document.getElementById('btnPublicar');
  const statusEl = document.getElementById('pubStatus');
  const get=id=>document.getElementById(id)?.value||'';
  const pubSite=document.getElementById('fPubSite')?.checked;
  const pubCar=document.getElementById('fPubCarrossel')?.checked;
  const pubInsta=document.getElementById('fPubInsta')?.checked;
  const pubFace=document.getElementById('fPubFace')?.checked;
  
  console.log('Publicar clicado', {pubSite, pubCar, pubInsta, pubFace, fotos: tempFotos.length});
  
  if(!pubSite && !pubCar && !pubInsta && !pubFace){ 
    alert('Marque onde publicar: Site, Carrossel, Instagram ou Facebook'); 
    return; 
  }
  
  if(tempFotos.length===0 && (pubFace || pubInsta)){
    if(!confirm('⚠️ Nenhuma foto adicionada! Publicar sem fotos? (Recomendado adicionar pelo menos 1 foto)')) return;
  }
  
  const originalText = btn ? btn.textContent : '📢 Publicar';
  if(btn){ btn.textContent='⏳ Publicando...'; btn.disabled=true; btn.style.background='#fff3cd'; }
  if(statusEl){ statusEl.style.display='block'; statusEl.innerHTML='⏳ Iniciando publicação...'; }
  
  const imovelTemp = {
    id: editingId || 'TEMP-'+Date.now(),
    codigo: get('fCodigo')||'NOVO',
    titulo: get('fTitulo')||'Imóvel',
    valor: Number(get('fValor2')||0),

    dorm: Number(get('fDorm2')||0),
    vagas: Number(get('fVagas')||0),
    suites: Number(get('fSuites')||0),

    condominioValor: Number(get('fCondValor')||0),
    fotos: tempFotos.length? tempFotos : []
  };
  
  let resultados = [];
  let erros = [];
  
  try{
    if(pubSite || pubCar){
      resultados.push('🌐 Site/Carrossel ✅ (salvo local)');
      if(statusEl) statusEl.innerHTML += '<br>🌐 Site/Carrossel ✅';
    }
    
    if(pubFace){
      if(statusEl) statusEl.innerHTML += '<br>📘 Facebook: enviando '+imovelTemp.fotos.length+' fotos...';
      if(btn) btn.textContent='📘 Face 0/'+imovelTemp.fotos.length+'...';
      try{
        const ok = await publicarNoFacebookAutomatico(imovelTemp, btn);
        if(ok){
          resultados.push('📘 Facebook com fotos ✅');
          if(statusEl) statusEl.innerHTML += ' ✅ Publicado!';
        } else {
          resultados.push('📘 Facebook ❌ falhou');
          erros.push('Facebook: erro desconhecido - veja console (F12)');
          if(statusEl) statusEl.innerHTML += ' ❌ Falhou';
        }
      }catch(e){
        console.error('Erro Face:', e);
        resultados.push('📘 Facebook ❌ erro: '+e.message);
        erros.push('Facebook: '+e.message);
        if(statusEl) statusEl.innerHTML += ' ❌ Erro: '+e.message;
      }
    }
    
    if(pubInsta){
      if(statusEl) statusEl.innerHTML += '<br>📸 Instagram: convertendo fotos e enviando...';
      if(btn) btn.textContent='📸 Insta 0/'+imovelTemp.fotos.length+'...';
      try{
        const ok = await publicarNoInstagramAutomatico(imovelTemp, btn);
        if(ok){
          resultados.push('📸 Instagram com fotos ✅');
          if(statusEl) statusEl.innerHTML += ' ✅ Publicado!';
        } else {
          resultados.push('📸 Instagram ❌ falhou (precisa de URL pública)');
          erros.push('Instagram: fotos do PC precisam ser convertidas via Facebook - tente novamente em 30s');
          if(statusEl) statusEl.innerHTML += ' ❌ Falhou - tente novamente';
        }
      }catch(e){
        console.error('Erro Insta:', e);
        resultados.push('📸 Instagram ❌ erro: '+e.message);
        erros.push('Instagram: '+e.message);
        if(statusEl) statusEl.innerHTML += ' ❌ Erro: '+e.message;
      }
    }
    
  }catch(e){
    console.error('Erro geral publicar:', e);
    alert('❌ Erro: '+e.message+'\n\nAbra F12 (console) para detalhes');
  }finally{
    if(btn){ btn.textContent='📢 Publicar'; btn.disabled=false; btn.style.background=''; }
    setTimeout(()=>{ if(statusEl) statusEl.style.display='none'; }, 8000);
  }
  
  let msg = '📢 Publicação concluída!\n\n' + resultados.join('\n');
  if(erros.length) msg += '\n\n⚠️ Detalhes:\n' + erros.join('\n');
  msg += '\n\nVerifique suas páginas:\n• Facebook: https://facebook.com/profile.php?id=100063722133658\n• Instagram: https://instagram.com/nivaldopiccinin\n\nSe falhou, abra F12 > Console e me envie print do erro.';
  
  alert(msg);
}


async function publicarAutomatico(data){
  // Chamado automaticamente ao salvar - publica só se marcou e com mensagem publicando
  const btn = document.getElementById('btnPublicar');
  if(btn) btn.textContent='⏳ Publicando...';
  
  if(data.publicarFacebook) await publicarNoFacebookAutomatico(data, btn);
  if(data.publicarInstagram) await publicarNoInstagramAutomatico(data, btn);
  
  if(btn) btn.textContent='📢 Publicar';
}

function getCodigoPrefix(tipo){
  const map={
    "Casa":"CA","Apartamento":"AP","Sobrado":"SO","Terreno":"TE","Sala Comercial":"SL","Salão Comercial":"SC","Galpão Industrial":"GA","Galpao Industrial":"GA","Chácara":"CH","Chacara":"CH","Sítio":"SI","Sitio":"SI","Fazenda":"FA","Área":"AR","Area":"AR","Loja":"LJ","Cobertura":"CO","Kitnet":"KI","Casa de Condomínio":"CC"
  };
  return map[tipo]||"IM";
}

function gerarCodigo(tipo){
  const prefix=getCodigoPrefix(tipo);
  const nums=properties.filter(p=>p.codigo && p.codigo.startsWith(prefix+'-')).map(p=>{ const m=p.codigo.match(/-(\d+)/); return m? parseInt(m[1]):0; });
  const max=nums.length? Math.max(...nums):0;
  return prefix+'-'+String(max+1).padStart(4,'0');
}

function atualizarCodigoAuto(){
  const tipo=document.getElementById('fTipo2')?.value||'';
  const codigoInput=document.getElementById('fCodigo');
  if(!codigoInput) return;
  if(codigoInput.value) return; // se já tem código não sobrescreve
  if(!tipo) return;
  const prefix=getCodigoPrefix(tipo);
  const nums=properties.filter(p=>p.codigo && p.codigo.startsWith(prefix+'-')).map(p=>{ const m=p.codigo.match(/-(\d+)/); return m? parseInt(m[1]):0; });
  const max=nums.length? Math.max(...nums):0;
  codigoInput.value=prefix+'-'+String(max+1).padStart(4,'0');
}

function handleFotosUpload(e){
  const files=[...e.target.files];
  if(tempFotos.length+files.length>30){ alert('Máximo 30 fotos! Você já tem '+tempFotos.length); return; }
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=ev=>{ tempFotos.push(ev.target.result); refreshFotosPreview(); };
    r.readAsDataURL(file);
  });
  e.target.value='';
}
function removeFoto(i){ tempFotos.splice(i,1); refreshFotosPreview(); }
function refreshFotosPreview(){
  const c=document.getElementById('fotosPreview');
  const cnt=document.getElementById('fotosCount');
  if(cnt) cnt.textContent=tempFotos.length+'/30 fotos • Primeira foto = capa do anúncio';
  if(!c) return;
  c.innerHTML=tempFotos.map((url,i)=>`<div draggable="true" ondragstart="dragStart(event,${i})" ondragover="dragOver(event)" ondrop="dropFoto(event,${i})" style="position:relative;border:2px solid ${i===0?'var(--primary)':'#c8e6c9'};border-radius:10px;overflow:hidden;cursor:grab;background:#fff"><img src="${url}" style="width:100%;height:70px;object-fit:cover" onerror="this.style.background='#f1f6ec'"><div style="position:absolute;top:2px;left:2px;background:${i===0?'var(--primary)':'rgba(0,0,0,.6)'};color:#fff;font-size:9px;padding:2px 6px;border-radius:999px;font-weight:700">${i===0?'CAPA':i+1}</div><button type="button" onclick="removeFoto(${i})" style="position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:none;background:#111;color:#fff;font-size:12px;cursor:pointer">✕</button></div>`).join('') + (tempFotos.length===0?'<div style="grid-column:1/-1;text-align:center;padding:16px;color:#888;font-size:11px;border:1px dashed var(--line);border-radius:10px">Nenhuma foto adicionada - clique acima para adicionar fotos do computador</div>':'');
}
function dragStart(e,i){ dragSrcIndex=i; e.dataTransfer.effectAllowed='move'; setTimeout(()=>{ e.target.style.opacity='0.5'; },0); }
function dragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; }
function dropFoto(e,ti){ e.preventDefault(); if(dragSrcIndex===null||dragSrcIndex===ti) return; const it=tempFotos.splice(dragSrcIndex,1)[0]; tempFotos.splice(ti,0,it); dragSrcIndex=null; refreshFotosPreview(); }

function saveImovel(){
  const get=id=>document.getElementById(id)?.value||'';
  if(!get('fTitulo')){ alert('Título obrigatório!'); document.getElementById('fTitulo')?.focus(); return; }
  if(!get('fTipo2')){ alert('Selecione o tipo do imóvel!'); return; }
  if(!get('fValor2')){ alert('Valor obrigatório!'); return; }
  const tipo=get('fTipo2');
  let codigo=get('fCodigo');
  if(!codigo) codigo=gerarCodigo(tipo);
  const data={
    id: editingId || 'ID-'+Date.now(),
    codigo: codigo.toUpperCase(),
    finalidade: get('fFinalidade')||'Venda',
    tipo: tipo,
    titulo: get('fTitulo'),
    bairro: (get('fBairro2')||'').toUpperCase(),
    cidade: get('fCidade')||'Indaiatuba',
    uf: get('fUF')||'SP',
    cep: get('fCEP')||'',
    endereco: get('fEndereco')||'',
    dorm: Number(get('fDorm2')||0),
    suites: Number(get('fSuites')||0),
    banheiros: Number(get('fBanheiros')||0),
    vagas: Number(get('fVagas')||0),
    areaConstruida: Number(get('fArea')||0),
    areaTerreno: Number(get('fAreaTerreno')||0),
    valor: Number(get('fValor2')||0),
    condominioValor: Number(get('fCondValor')||0),
    iptu: Number(get('fIPTU')||0),
    proprietarioId: get('fProprietario')||null,
    descricao: get('fDesc'),
    fotos: tempFotos.length? tempFotos : ['https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=800'],
    status: get('fStatus')||'Disponível',
    destaque: get('fDestaque')==='true',
    publicarCarrossel: document.getElementById('fPubCarrossel')?.checked || false,
    publicarSite: document.getElementById('fPubSite')?.checked || false,
    publicarInstagram: document.getElementById('fPubInsta')?.checked || false,
    publicarFacebook: document.getElementById('fPubFace')?.checked || false
  };
  if(editingId){ const idx=properties.findIndex(p=>p.id===editingId); if(idx>=0) properties[idx]=data; }
  else properties.unshift(data);
  saveToStorage(); closeModal(); renderImoveis();
  // toast
  setTimeout(()=>{ alert('✅ Imóvel '+data.codigo+' salvo com sucesso! '+data.fotos.length+' foto(s) • Proprietário: '+(owners.find(o=>o.id===data.proprietarioId)?.nome||'Sem vínculo')); },100);
}

function editImovel(id){ openImovelModal(id); }
function delImovel(id){ if(!confirm('Excluir imóvel '+id+'? Essa ação não pode ser desfeita.')) return; properties=properties.filter(p=>p.id!==id); saveToStorage(); renderImoveis(); }
function duplicarImovel(id){
  const p=properties.find(x=>x.id===id);
  if(!p) return;
  const novo={...p, id:'ID-'+Date.now(), codigo:gerarCodigo(p.tipo), titulo:p.titulo+' (CÓPIA)'};
  properties.unshift(novo);
  saveToStorage();
  renderImoveis();
  alert('✅ Imóvel duplicado! Novo código: '+novo.codigo);
}

function openOwnerModal(id=null){
  editingOwnerId=id;
  const o=id? owners.find(x=>x.id===id):null;
  const modal=document.getElementById('modal'); const titleEl=document.getElementById('mTitle'); const bodyEl=document.getElementById('mBody');
  if(!modal||!titleEl||!bodyEl) return;
  titleEl.textContent=o? 'Editar proprietário - Ficha completa' : 'Novo proprietário - Ficha completa';
  bodyEl.innerHTML=`
    <div class="fgrid">
      <label class="full">Nome completo*<input id="oNome" value="${(o?.nome||'').replace(/"/g,'&quot;')}" placeholder="Nome completo"></label>
      <label>CPF<input id="oCpf" value="${o?.cpf||''}" placeholder="000.000.000-00"></label><label>RG<input id="oRg" value="${o?.rg||''}"></label>
      <label>Telefone*<input id="oTelefone" value="${o?.telefone||''}" placeholder="(19) 9xxxx-xxxx"></label><label>Telefone 2<input id="oTelefone2" value="${o?.telefone2||''}"></label>
      <label class="full">Email<input id="oEmail" value="${o?.email||''}"></label>
      <label class="full">Endereço<input id="oEndereco" value="${o?.endereco||''}"></label>
      <label>Número<input id="oNumero" value="${o?.numero||''}"></label><label>Bairro<input id="oBairro" value="${o?.bairro||''}"></label>
      <label>Cidade<input id="oCidade" value="${o?.cidade||'Indaiatuba'}"></label><label>UF<input id="oUF" value="${o?.uf||'SP'}"></label>
      <label>CEP<input id="oCEP" value="${o?.cep||''}"></label><label>Estado civil<select id="oEstadoCivil"><option ${o?.estadoCivil==='Solteiro(a)'?'selected':''}>Solteiro(a)</option><option ${o?.estadoCivil==='Casado(a)'?'selected':''}>Casado(a)</option><option ${o?.estadoCivil==='Divorciado(a)'?'selected':''}>Divorciado(a)</option><option ${o?.estadoCivil==='Viúvo(a)'?'selected':''}>Viúvo(a)</option></select></label>
      <label class="full">Profissão<input id="oProfissao" value="${o?.profissao||''}"></label>
      <label class="full">Observações<textarea id="oObs">${o?.observacoes||''}</textarea></label>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-dark" onclick="saveOwner()">💾 Salvar proprietário</button></div>
  `;
  modal.classList.add('open');
}
function saveOwner(){
  const get=id=>document.getElementById(id)?.value||'';
  if(!get('oNome')){ alert('Nome obrigatório!'); return; }
  const data={id:editingOwnerId||'P-'+Date.now(),nome:get('oNome'),cpf:get('oCpf'),rg:get('oRg'),telefone:get('oTelefone'),telefone2:get('oTelefone2'),email:get('oEmail'),endereco:get('oEndereco'),numero:get('oNumero'),bairro:get('oBairro'),cidade:get('oCidade'),uf:get('oUF'),cep:get('oCEP'),estadoCivil:get('oEstadoCivil'),profissao:get('oProfissao'),observacoes:get('oObs'),imoveis:[]};
  if(editingOwnerId){ const idx=owners.findIndex(o=>o.id===editingOwnerId); if(idx>=0){ data.imoveis=owners[idx].imoveis||[]; owners[idx]=data; } } else owners.unshift(data);
  saveToStorage(); closeModal(); renderProps();
}
